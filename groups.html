<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOICE SIGNAL | グループ監視</title>
<style>
:root{font:16px/1.5 system-ui,'Noto Sans JP',sans-serif;background:#03110e;color:#d2ffe9;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(ellipse at top,#103c2c,#03110e 72%);min-height:100vh}
main{max-width:1450px;margin:auto}
header,.panel{border:1px solid #318b68;background:#061f18;border-radius:12px;margin-bottom:13px;padding:16px;box-shadow:inset 0 0 20px #0e3b2d}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-size:clamp(23px,3vw,38px);color:#70f9bb;margin:0;line-height:1.3}
h2{color:#a1edc9;font-size:17px;margin:0 0 12px}
small,.sub{color:#93c9af}
.tag{font-weight:850;padding:7px 12px;border:1px solid #287c5a;border-radius:30px;color:#9ef8c5}
button,input,select{font:inherit;border-radius:6px}
button{border:1px solid #53c898;background:#155d43;color:white;padding:10px 15px;font-weight:850;cursor:pointer}
button.secondary{background:#09291f}
button:disabled{opacity:.6}
input,select{border:1px solid #428869;background:#041710;color:white;padding:10px;min-width:0}
label{font-size:12px;color:#9ce5c3;font-weight:800;display:flex;flex-direction:column;gap:4px}
.controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.controls label{flex:1;min-width:105px}.controls #endpointWrap{flex:2}
.controls #tokenWrap{flex:1.4}
.note{font-size:12px;color:#b0dec7;margin-top:10px}
#message{font-weight:800;color:#ffc878;min-height:23px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.groupCard{border:2px solid #247458;border-radius:12px;padding:15px;background:linear-gradient(140deg,#092920,#031713);min-width:0;position:relative;overflow:hidden}
.groupCard.online{border-color:#4fe1a2;box-shadow:0 0 13px #19946944}
.groupCard.offline{border-color:#866b42}
.groupCard h3{font-size:20px;margin:0 0 10px;color:#bcffe2;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mic{font-size:14px;font-weight:900;border-radius:5px;padding:7px 10px;white-space:nowrap;background:#173229;border:1px solid #4a9473;color:#8eecbd}
.mic.off{background:#33251c;border-color:#b77e53;color:#ffb778}
.mic.unknown{background:#292b26;border-color:#5b645c;color:#bcc8bf}
.level{font:900 clamp(42px,6vw,76px)/1 Consolas,monospace;color:#75f2b7;text-align:center;padding:6px 0}
.level small{font-size:16px}
.bar{height:11px;border:1px solid #376d57;background:#07150f;border-radius:2px;overflow:hidden}
.bar>div{height:100%;background:#56ddb0;width:0;transition:width .25s}
.cardDetails{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 0}
.stat{padding:8px;background:#0a2a20;border:1px solid #1c5e48;border-radius:6px;font-size:12px;color:#99d0b5}
.stat strong{display:block;color:#eefff7;font-size:19px}
.cardFoot{color:#96bda9;font-size:12px;margin-top:9px}
.stateRed{color:#ff6877}.stateYellow{color:#ffd17a}
.history{max-height:330px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #235943;text-align:left}
th{color:#9ef5cb;position:sticky;top:0;background:#0b3226}
.empty{padding:17px;color:#92c7aa}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){body{padding:8px}.cards{grid-template-columns:1fr}.controls label{min-width:140px}.groupCard{padding:12px}}
</style></head><body><main>
<header><div><div class="sub">VOICE SIGNAL CLASSROOM · TEACHER DASHBOARD</div><h1>◉ グループ一斉監視</h1><small>各班のマイク状態・音量・警告回数を確認</small></div><span class="tag" id="live">● 未接続</span></header>
<section class="panel"><h2>接続設定</h2>
<div class="controls">
<label id="endpointWrap">Worker API URL<input id="endpoint" value="https://voice-signal-remote.schoolhub-lab.workers.dev"></label>
<label>基本教室ID<input id="baseRoom" value="class-1" maxlength="42"></label>
<label>グループ数<select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label>
<label id="tokenWrap">管理者キー<input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="off"></label>
<button id="connect">▶ 監視開始</button><button class="secondary" id="disconnect">停止</button>
</div>
<div id="message" role="status"></div>
<p class="note">各班の端末で「グループ監視」を選び、同じ基本教室IDと異なる班番号を設定して接続してください。音声・映像は収集しません。</p></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px"><h2>グループ別 LIVE 状態</h2><span id="lastPoll" class="sub">接続待ち</span></div>
<div class="cards" id="cards" aria-live="polite"></div></section>
<section class="panel"><div class="controls" style="justify-content:space-between"><h2>マイクON/OFF 変更履歴</h2><div><button class="secondary" id="export">履歴CSV</button> <button class="secondary" id="clearHistory">この端末の履歴を消去</button></div></div>
<p class="note">履歴は、この教師端末が監視中に検知したON/OFF変化を保存します。監視していない時間の操作は記録できません。音声録音ではありません。</p>
<div class="history"><table><thead><tr><th>日時</th><th>グループ</th><th>状態</th><th>直前の状態</th></tr></thead><tbody id="logBody"><tr><td colspan="4">記録はまだありません</td></tr></tbody></table></div>
</section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);
let endpoint='',base='',token='',count=6,online=false,polling=null,pollBusy=false,previous={},log=[],run=0;
try{const config=JSON.parse(localStorage.getItem('vsc-groups-dashboard')||'{}');$('endpoint').value=config.endpoint||$('endpoint').defaultValue;$('baseRoom').value=config.base||'class-1';$('count').value=String(config.count||6)}catch{}
function storeLog(){try{localStorage.setItem('vsc-mic-onoff-history-'+base,JSON.stringify(log.slice(-1500)))}catch{}}
function renderLog(){const body=$('logBody');body.replaceChildren();if(!log.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='記録はまだありません';tr.append(td);body.append(tr);return}
for(const e of log.slice(-100).reverse()){const tr=document.createElement('tr');for(const text of [new Date(e.at).toLocaleString('ja-JP'),e.group+'班',e.now?'マイクON':'マイクOFF',e.was?'マイクON':'マイクOFF']){const td=document.createElement('td');td.textContent=text;tr.append(td)}body.append(tr)}}
function formatSignal(s){return {green:'静粛',yellow:'注意',red:'警告',idle:'待機',paused:'一時停止'}[s]||'不明'}
function buildCards(){const cards=$('cards');cards.replaceChildren();for(let i=1;i<=count;i++){const el=document.createElement('article');el.className='groupCard offline';el.id='group-'+i;el.innerHTML='<h3><span>'+i+'班</span><span class="mic unknown" data-role="mic">● 未接続</span></h3><div class="level" data-role="level">-- <small>/100</small></div><div class="bar"><div data-role="bar"></div></div><div class="cardDetails"><div class="stat">警告回数<strong data-role="warnings">—</strong></div><div class="stat">静粛率<strong data-role="quiet">—</strong></div></div><div class="cardFoot" data-role="foot">教室端末の通信待ち</div>';cards.append(el)}}
function setCard(i,state){const card=$('group-'+i);if(!card)return;const age=state?Math.max(0,Date.now()-state.at):Infinity;const fresh=age<12000;const mic=card.querySelector('[data-role=mic]');const lvl=card.querySelector('[data-role=level]');const meter=card.querySelector('[data-role=bar]');const foot=card.querySelector('[data-role=foot]');
 card.classList.toggle('online',fresh);card.classList.toggle('offline',!fresh);
 mic.className='mic '+(!fresh?'unknown':state.mic?'':'off');mic.textContent=!fresh?'● 通信停止':state.mic?'● マイクON':'● マイクOFF';
 lvl.innerHTML=(fresh?Math.round(state.level||0):'--')+' <small>/100</small>';
 meter.style.width=fresh?Math.max(0,Math.min(100,state.level||0))+'%':'0%';
 const warnings=card.querySelector('[data-role=warnings]'),quiet=card.querySelector('[data-role=quiet]');
 warnings.textContent=fresh?state.count+'回':'—';quiet.textContent=fresh?Math.round(state.quietRate||0)+'%':'—';
 foot.textContent=fresh?(formatSignal(state.signal)+' ／ 最終更新 '+Math.ceil(age/1000)+'秒前'):'オフライン ／ 状態は不明';
 if(!fresh)return;
 // Compare observed transitions only; don't create fictitious events from stale snapshots or first sight.
 const prev=previous[i];
 if(prev&&prev.at!==state.at&&prev.mic!==!!state.mic){log.push({at:state.at,group:i,was:prev.mic,now:!!state.mic});storeLog();renderLog()}
 previous[i]={at:state.at,mic:!!state.mic};
}
async function query(i){const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),6000);try{
 const id=base+'-g'+i;const url=endpoint+'/api/sync?room='+encodeURIComponent(id);
 const r=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:ctl.signal,cache:'no-store'});
 const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'HTTP '+r.status);return d.state||null;
}finally{clearTimeout(timeout)}}
async function refresh(){if(!online||pollBusy)return;pollBusy=true;const currentRun=run;
 try{const results=await Promise.allSettled(Array.from({length:count},(_,i)=>query(i+1)));if(currentRun!==run)return;
 let errors=0;for(let i=0;i<results.length;i++){const res=results[i];if(res.status==='fulfilled')setCard(i+1,res.value);else{errors++;setCard(i+1,null)}}
 $('lastPoll').textContent='最終確認 '+new Date().toLocaleTimeString('ja-JP');
 $('live').textContent=errors?'● '+errors+'件の通信エラー':'● 監視中';
 $('live').style.color=errors?'#ffd27b':'#75f8bb';
 if(errors)$('message').textContent='一部の班に接続できません。キーや通信状態を確認してください。';
 }finally{pollBusy=false}}
function disconnect(){online=false;run++;clearInterval(polling);polling=null;$('live').textContent='● 停止中';$('message').textContent='監視を停止しました'}
$('connect').onclick=async()=>{disconnect();endpoint=$('endpoint').value.trim().replace(/\/$/,'');base=$('baseRoom').value.trim();token=$('key').value.trim();count=Number($('count').value);
 if(!/^https:\/\/[^/\s]+$/.test(endpoint)||!/^[a-zA-Z0-9_-]{1,42}$/.test(base)||!token){$('message').textContent='Worker URL・基本教室ID・管理者キーを確認してください';return}
 const currentRun=run;try{await query(1);if(run!==currentRun)return;online=true;previous={};try{log=JSON.parse(localStorage.getItem('vsc-mic-onoff-history-'+base)||'[]');if(!Array.isArray(log))log=[]}catch{log=[]}
 renderLog();buildCards();try{localStorage.setItem('vsc-groups-dashboard',JSON.stringify({endpoint,base,count}))}catch{}
 $('message').textContent='グループの状態を確認しています。';await refresh();polling=setInterval(refresh,2300);
 }catch(e){$('message').textContent='接続失敗：'+e.message;$('live').textContent='● 接続失敗'}};
$('disconnect').onclick=disconnect;
$('export').onclick=()=>{const lines=[['日時','グループ','状態','変更前']];for(const e of log)lines.push([new Date(e.at).toLocaleString('ja-JP'),e.group+'班',e.now?'ON':'OFF',e.was?'ON':'OFF']);const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='グループ_マイク状態履歴_'+(base||'教室')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
$('clearHistory').onclick=()=>{if(!confirm('この教師端末に保存された履歴を消去しますか？'))return;log=[];storeLog();renderLog()};
buildCards();
})();
</script></body></html>
